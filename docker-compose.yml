services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocampo-construction-supply
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ocampo_construction_supply
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - .:/var/www
    command: >
      sh -c "cp -n .env.docker .env && php artisan key:generate --force && php artisan migrate --force --seed && php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8.0
    container_name: ocampo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ocampo_construction_supply
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
